name: test-operation-ui
description: |
  Operation section UI interaction test (new design).
  Actually clicks buttons on Oscar's page (/ai-team/operation):
    1. Click "New chat" → verify fresh chat
    2. Click "List products" chip → verify triggered
    3. Click "Show reports" chip → verify triggered
    4. Click "Manage inventory" chip → verify triggered
    5. Click each Skill card → verify selection
    6. Click "View Store" button → verify Shopify opens

steps:
  - include: _shared/login.steps.yml

  # ════════════════════════════════════════════════════════════════
  # NAVIGATE TO OPERATION PAGE
  # ════════════════════════════════════════════════════════════════
  - id: nav-operation
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/operation"
      waitUntil: "domcontentloaded"

  - id: wait-load
    action: wait
    params:
      ms: 3000

  - id: screenshot-initial
    action: browser.screenshot
    params:
      name: "operation-ui-01-initial"

  # ════════════════════════════════════════════════════════════════
  # 1. Click "New chat" button
  # ════════════════════════════════════════════════════════════════
  - id: click-new-chat
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (!btn) throw new Error('"New chat" button not found');
        btn.click();
        return { clicked: true };

  - id: wait-new-chat
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-new-chat
    action: browser.screenshot
    params:
      name: "operation-ui-02-after-new-chat"

  - id: assert-chat-ready
    action: browser.execute
    params:
      script: |
        const text = document.body.innerText;
        const url = window.location.href;
        const hasOscar = text.includes('Oscar');
        return { ok: true, url, hasOscar };

  - id: log-new-chat
    action: log
    params:
      message: "✅ Clicked New chat"

  # ════════════════════════════════════════════════════════════════
  # 2. Click "List products" quick chip
  # ════════════════════════════════════════════════════════════════
  - id: nav-fresh-operation
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/operation"
      waitUntil: "domcontentloaded"

  - id: wait-fresh
    action: wait
    params:
      ms: 3000

  - id: click-chip-list-products
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('List products'));
        if (!chip) throw new Error('"List products" chip not found');
        chip.click();
        return { clicked: true, text: chip.textContent.trim() };

  - id: wait-list-products
    action: wait
    params:
      ms: 2000

  - id: screenshot-list-products
    action: browser.screenshot
    params:
      name: "operation-ui-03-list-products-chip"

  - id: assert-list-products-triggered
    action: browser.execute
    params:
      script: |
        const textarea = document.querySelector('textarea');
        const inputFilled = textarea && textarea.value.length > 0;
        const text = document.body.innerText;
        return { ok: true, inputFilled, inputValue: textarea ? textarea.value.slice(0, 80) : '', pageText: text.slice(0, 200) };

  - id: log-list-products
    action: log
    params:
      message: "✅ Clicked List products chip"

  # ════════════════════════════════════════════════════════════════
  # 3. Click "Show reports" quick chip
  # ════════════════════════════════════════════════════════════════
  - id: nav-fresh-2
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/operation"
      waitUntil: "domcontentloaded"

  - id: wait-fresh-2
    action: wait
    params:
      ms: 3000

  - id: click-chip-show-reports
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Show reports'));
        if (!chip) throw new Error('"Show reports" chip not found');
        chip.click();
        return { clicked: true, text: chip.textContent.trim() };

  - id: wait-show-reports
    action: wait
    params:
      ms: 2000

  - id: screenshot-show-reports
    action: browser.screenshot
    params:
      name: "operation-ui-04-show-reports-chip"

  - id: log-show-reports
    action: log
    params:
      message: "✅ Clicked Show reports chip"

  # ════════════════════════════════════════════════════════════════
  # 4. Click "Manage inventory" quick chip
  # ════════════════════════════════════════════════════════════════
  - id: nav-fresh-3
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/operation"
      waitUntil: "domcontentloaded"

  - id: wait-fresh-3
    action: wait
    params:
      ms: 3000

  - id: click-chip-manage-inventory
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Manage inventory'));
        if (!chip) throw new Error('"Manage inventory" chip not found');
        chip.click();
        return { clicked: true, text: chip.textContent.trim() };

  - id: wait-manage-inventory
    action: wait
    params:
      ms: 2000

  - id: screenshot-manage-inventory
    action: browser.screenshot
    params:
      name: "operation-ui-05-manage-inventory-chip"

  - id: log-manage-inventory
    action: log
    params:
      message: "✅ Clicked Manage inventory chip"

  # ════════════════════════════════════════════════════════════════
  # 5. Click each Skill card in the sidebar
  # ════════════════════════════════════════════════════════════════
  - id: nav-fresh-4
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/operation"
      waitUntil: "domcontentloaded"

  - id: wait-fresh-4
    action: wait
    params:
      ms: 3000

  # — Product Selection Reports —
  - id: click-skill-product-selection
    action: browser.execute
    params:
      script: |
        const els = Array.from(document.querySelectorAll('button, a, [role="button"], div, li'));
        const skill = els.find(b => b.textContent.includes('Product Selection'));
        if (!skill) throw new Error('"Product Selection Reports" skill not found');
        skill.click();
        return { clicked: true, text: skill.textContent.trim().slice(0, 60) };

  - id: wait-skill-product
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-product
    action: browser.screenshot
    params:
      name: "operation-ui-06-skill-product-selection"

  # — Sourcing & Freight —
  - id: click-skill-sourcing
    action: browser.execute
    params:
      script: |
        const els = Array.from(document.querySelectorAll('button, a, [role="button"], div, li'));
        const skill = els.find(b => b.textContent.includes('Sourcing') && b.textContent.includes('Freight'));
        if (!skill) throw new Error('"Sourcing & Freight" skill not found');
        skill.click();
        return { clicked: true };

  - id: wait-skill-sourcing
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-sourcing
    action: browser.screenshot
    params:
      name: "operation-ui-07-skill-sourcing"

  # — Listing & Repricing —
  - id: click-skill-listing
    action: browser.execute
    params:
      script: |
        const els = Array.from(document.querySelectorAll('button, a, [role="button"], div, li'));
        const skill = els.find(b => b.textContent.includes('Listing') && b.textContent.includes('Repricing'));
        if (!skill) throw new Error('"Listing & Repricing" skill not found');
        skill.click();
        return { clicked: true };

  - id: wait-skill-listing
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-listing
    action: browser.screenshot
    params:
      name: "operation-ui-08-skill-listing"

  # — Margin & Sales Dashboard —
  - id: click-skill-margin
    action: browser.execute
    params:
      script: |
        const els = Array.from(document.querySelectorAll('button, a, [role="button"], div, li'));
        const skill = els.find(b => b.textContent.includes('Margin') && b.textContent.includes('Sales'));
        if (!skill) throw new Error('"Margin & Sales Dashboard" skill not found');
        skill.click();
        return { clicked: true };

  - id: wait-skill-margin
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-margin
    action: browser.screenshot
    params:
      name: "operation-ui-09-skill-margin"

  - id: log-skills
    action: log
    params:
      message: "✅ Clicked all 4 skill cards"

  # ════════════════════════════════════════════════════════════════
  # 6. Click "View Store" button
  # ════════════════════════════════════════════════════════════════
  - id: click-view-store
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('View Store') || b.textContent.includes('View store'));
        if (!btn) throw new Error('"View Store" button not found');
        // Note: this opens Shopify in a new tab — just click and verify it's clickable
        const href = btn.href || btn.getAttribute('href') || '';
        btn.click();
        return { clicked: true, href };

  - id: wait-view-store
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-view-store
    action: browser.screenshot
    params:
      name: "operation-ui-10-after-view-store"

  - id: log-view-store
    action: log
    params:
      message: "✅ Clicked View Store button"

  - id: log-done
    action: log
    params:
      message: "====== Operation UI Interaction Test Complete — all buttons clicked ======"
