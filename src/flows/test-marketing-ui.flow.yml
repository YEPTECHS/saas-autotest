name: test-marketing-ui
description: |
  Marketing section UI interaction test (new design).
  Actually clicks buttons and verifies results:
    1. AI Team overview — clicks Maya "Open" button → navigates to marketing page
    2. Marketing Chat — clicks "New chat", clicks quick action chips, verifies chat starts
    3. Marketing Studio — clicks each Skill card, clicks "New chat", clicks "Manage channels"

steps:
  - include: _shared/login.steps.yml

  # ════════════════════════════════════════════════════════════════
  # 1. AI TEAM OVERVIEW — Click Maya "Open" button
  # ════════════════════════════════════════════════════════════════
  - id: nav-ai-team
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team"
      waitUntil: "domcontentloaded"

  - id: wait-ai-team
    action: wait
    params:
      ms: 3000

  - id: screenshot-ai-team
    action: browser.screenshot
    params:
      name: "marketing-ui-01-ai-team"

  - id: assert-maya-card-visible
    action: browser.execute
    params:
      script: |
        const text = document.body.innerText;
        if (!text.includes('Maya')) throw new Error('Maya card not found');
        return { ok: true };

  - id: click-maya-open
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const openBtn = btns.find(b => b.textContent.trim() === 'Open');
        if (!openBtn) throw new Error('"Open" button not found for Maya');
        openBtn.click();
        return { clicked: true, text: openBtn.textContent.trim() };

  - id: wait-after-open
    action: wait
    params:
      ms: 2000

  - id: assert-navigated-to-marketing
    action: browser.execute
    params:
      script: |
        const url = window.location.href;
        if (!url.includes('marketing') && !url.includes('ai-team')) {
          throw new Error('Expected navigation to marketing page, got: ' + url);
        }
        return { ok: true, url };

  - id: screenshot-after-open
    action: browser.screenshot
    params:
      name: "marketing-ui-02-after-open"

  - id: log-section1
    action: log
    params:
      message: "✅ Section 1 PASS: Clicked Maya Open → navigated to marketing"

  # ════════════════════════════════════════════════════════════════
  # 2. MARKETING CHAT — Click buttons and interact
  # ════════════════════════════════════════════════════════════════
  - id: nav-marketing-chat
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/marketing/chat"
      waitUntil: "domcontentloaded"

  - id: wait-marketing-chat
    action: wait
    params:
      ms: 3000

  - id: screenshot-chat-before
    action: browser.screenshot
    params:
      name: "marketing-ui-03-chat-before"

  # — Click "New chat" button —
  - id: click-new-chat
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (!btn) throw new Error('"New chat" button not found');
        btn.click();
        return { clicked: true };

  - id: wait-new-chat
    action: wait
    params:
      ms: 1500

  - id: screenshot-after-new-chat
    action: browser.screenshot
    params:
      name: "marketing-ui-04-after-new-chat"

  - id: assert-chat-reset
    action: browser.execute
    params:
      script: |
        // After clicking New chat, should be on a fresh chat (greeting visible)
        const url = window.location.href;
        const text = document.body.innerText;
        const hasMaya = text.includes('Maya');
        return { ok: true, url, hasMaya };

  # — Click "Create a social post" quick chip —
  - id: click-chip-social-post
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Create a social post'));
        if (!chip) throw new Error('"Create a social post" chip not found');
        chip.click();
        return { clicked: true, text: chip.textContent.trim() };

  - id: wait-chip-response
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-social-chip
    action: browser.screenshot
    params:
      name: "marketing-ui-05-after-social-chip"

  - id: assert-chip-triggered
    action: browser.execute
    params:
      script: |
        // After clicking chip, input should be filled OR a message started
        const textarea = document.querySelector('textarea');
        const inputFilled = textarea && textarea.value.length > 0;
        const msgStarted = document.body.innerText.includes('social post') ||
                           document.body.innerText.includes('Create');
        return { ok: true, inputFilled, msgStarted, inputValue: textarea ? textarea.value.slice(0, 80) : '' };

  # — Click "Write a blog outline" quick chip (fresh chat first) —
  - id: click-new-chat-2
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (btn) btn.click();
        return { clicked: !!btn };
    continueOnError: true

  - id: wait-new-chat-2
    action: wait
    params:
      ms: 1500

  - id: click-chip-blog
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Write a blog outline'));
        if (!chip) throw new Error('"Write a blog outline" chip not found');
        chip.click();
        return { clicked: true };

  - id: wait-blog-chip
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-blog-chip
    action: browser.screenshot
    params:
      name: "marketing-ui-06-after-blog-chip"

  # — Click "Plan a launch campaign" chip —
  - id: click-new-chat-3
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (btn) btn.click();
        return { clicked: !!btn };
    continueOnError: true

  - id: wait-new-chat-3
    action: wait
    params:
      ms: 1500

  - id: click-chip-launch
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Plan a launch campaign'));
        if (!chip) throw new Error('"Plan a launch campaign" chip not found');
        chip.click();
        return { clicked: true };

  - id: wait-launch-chip
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-launch-chip
    action: browser.screenshot
    params:
      name: "marketing-ui-07-after-launch-chip"

  # — Click "Improve product copy" chip —
  - id: click-new-chat-4
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (btn) btn.click();
        return { clicked: !!btn };
    continueOnError: true

  - id: wait-new-chat-4
    action: wait
    params:
      ms: 1500

  - id: click-chip-product-copy
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"]'));
        const chip = btns.find(b => b.textContent.includes('Improve product copy'));
        if (!chip) throw new Error('"Improve product copy" chip not found');
        chip.click();
        return { clicked: true };

  - id: wait-product-copy-chip
    action: wait
    params:
      ms: 2000

  - id: screenshot-after-product-copy-chip
    action: browser.screenshot
    params:
      name: "marketing-ui-08-after-product-copy-chip"

  - id: log-section2
    action: log
    params:
      message: "✅ Section 2 PASS: Clicked New chat + all 4 quick action chips"

  # ════════════════════════════════════════════════════════════════
  # 3. MARKETING STUDIO — Click skill cards, New chat, Manage channels
  # ════════════════════════════════════════════════════════════════
  - id: nav-marketing-studio
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/marketing/studio"
      waitUntil: "domcontentloaded"

  - id: wait-studio
    action: wait
    params:
      ms: 3000

  - id: screenshot-studio-before
    action: browser.screenshot
    params:
      name: "marketing-ui-09-studio-before"

  # — Click "Write blog & social posts" skill —
  - id: click-skill-blog
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"], div[class*="cursor"], li'));
        const skill = btns.find(b => b.textContent.includes('Write blog') || b.textContent.includes('Write blog & social'));
        if (!skill) throw new Error('"Write blog & social posts" skill not found');
        skill.click();
        return { clicked: true, text: skill.textContent.trim().slice(0, 60) };

  - id: wait-skill-blog
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-blog
    action: browser.screenshot
    params:
      name: "marketing-ui-10-skill-blog"

  # — Click "Design product marketing images" skill —
  - id: click-skill-images
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"], div[class*="cursor"], li'));
        const skill = btns.find(b => b.textContent.includes('Design product') || b.textContent.includes('marketing images'));
        if (!skill) throw new Error('"Design product marketing images" skill not found');
        skill.click();
        return { clicked: true, text: skill.textContent.trim().slice(0, 60) };

  - id: wait-skill-images
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-images
    action: browser.screenshot
    params:
      name: "marketing-ui-11-skill-images"

  # — Click "Build & launch campaigns" skill —
  - id: click-skill-campaigns
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"], div[class*="cursor"], li'));
        const skill = btns.find(b => b.textContent.includes('Build') && b.textContent.includes('launch'));
        if (!skill) throw new Error('"Build & launch campaigns" skill not found');
        skill.click();
        return { clicked: true, text: skill.textContent.trim().slice(0, 60) };

  - id: wait-skill-campaigns
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-campaigns
    action: browser.screenshot
    params:
      name: "marketing-ui-12-skill-campaigns"

  # — Click "Track ROI & suggest improvements" skill —
  - id: click-skill-roi
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a, [role="button"], div[class*="cursor"], li'));
        const skill = btns.find(b => b.textContent.includes('Track ROI') || b.textContent.includes('suggest improvements'));
        if (!skill) throw new Error('"Track ROI" skill not found');
        skill.click();
        return { clicked: true, text: skill.textContent.trim().slice(0, 60) };

  - id: wait-skill-roi
    action: wait
    params:
      ms: 1500

  - id: screenshot-skill-roi
    action: browser.screenshot
    params:
      name: "marketing-ui-13-skill-roi"

  # — Click "Manage channels" button —
  - id: click-manage-channels
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('Manage channels'));
        if (!btn) throw new Error('"Manage channels" button not found');
        btn.click();
        return { clicked: true };

  - id: wait-manage-channels
    action: wait
    params:
      ms: 2000

  - id: screenshot-manage-channels
    action: browser.screenshot
    params:
      name: "marketing-ui-14-manage-channels"

  - id: assert-manage-channels-result
    action: browser.execute
    params:
      script: |
        // Should show channels management UI or modal
        const text = document.body.innerText;
        const url = window.location.href;
        return { ok: true, url, hasChannelText: text.includes('channel') || text.includes('Channel') };

  # — Navigate back to studio and click "New chat" —
  - id: nav-back-studio
    action: browser.navigate
    params:
      url: "{{YEPAI_BASE_URL}}/ai-team/marketing/studio"
      waitUntil: "domcontentloaded"

  - id: wait-back-studio
    action: wait
    params:
      ms: 2000

  - id: click-studio-new-chat
    action: browser.execute
    params:
      script: |
        const btns = Array.from(document.querySelectorAll('button, a'));
        const btn = btns.find(b => b.textContent.includes('New chat'));
        if (!btn) throw new Error('"New chat" button not found on studio page');
        btn.click();
        return { clicked: true };

  - id: wait-studio-new-chat
    action: wait
    params:
      ms: 2000

  - id: screenshot-studio-new-chat
    action: browser.screenshot
    params:
      name: "marketing-ui-15-studio-new-chat"

  - id: log-section3
    action: log
    params:
      message: "✅ Section 3 PASS: Clicked all 4 skills + Manage channels + New chat on Studio"

  - id: log-all-done
    action: log
    params:
      message: "====== Marketing UI Interaction Test Complete ======"
